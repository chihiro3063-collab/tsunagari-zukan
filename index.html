<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つながり図鑑（試作）</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F7A6D">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--teal:#1F7A6D;--ink:#1F2A2E;--sub:#5B6468;--line:#E4E0D6;--bg:#F7F5F0;--amber:#8A4B08}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
header{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
header h1{margin:0;font-size:18px}
header small{color:var(--sub);font-size:11px}
#stage{position:relative;flex:1;min-height:0}
#stage{background:#fff}
#gcv{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#lasso{position:absolute;top:0;left:0;width:100%;height:100%;z-index:6;touch-action:none;display:none;background:rgba(224,138,0,.06)}
#lasso.on{display:block}
#lbar{position:absolute;left:10px;right:10px;top:10px;z-index:7;display:none;background:#1F2A2E;color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
#lbar.on{display:block}
#b_guide{position:absolute;left:10px;bottom:12px;z-index:3;width:58px;height:58px;border-radius:50%;border:0;background:transparent;box-shadow:0 3px 8px rgba(0,0,0,.18);display:none;align-items:center;justify-content:center;padding:0}
.gbadge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#E53935;color:#fff;font-size:12px;line-height:22px;text-align:center;padding:0 5px;font-weight:700}
.gwrap{display:flex;gap:10px;align-items:flex-start}
.gbub{position:relative;background:#FFF3D6;border:2px solid #E3AE72;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.6;color:#1F2A2E;flex:1}
.gsay{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.14);border-radius:14px;padding:8px}
.gsay .gbub{color:#1F2A2E}
.gchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid;color:#1F2A2E}
.gchip i,.gdot{display:inline-block;width:8px;height:8px;border-radius:50%}
.gdot{margin-left:2px}
#lbar .lb{display:flex;gap:8px;margin-top:8px}
#lbar button{flex:1;min-height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:700}
#graph{position:absolute;z-index:1;top:0;left:0;right:0;bottom:0;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#banner{position:absolute;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:12px;background:#1F2A2E;color:#fff;font-size:13px;display:none;pointer-events:none}
#banner.show{display:block}
#hint{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 12px;border-radius:12px;background:#FDF3E3;color:var(--amber);font-size:12px;line-height:1.6;pointer-events:none}
#bar{flex:none;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff}
.btn{flex:1;min-height:46px;border-radius:12px;border:1px solid #CFCABD;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:0 6px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{border-color:#B3261E;color:#B3261E}
.btn:disabled{opacity:.4}
.btn:active{filter:brightness(.95)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.18);padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;max-height:70vh;overflow:auto}
#sheet.open{transform:none}
#modal{position:fixed;left:0;right:0;top:0;bottom:0;z-index:30;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#mbox{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#mbox h3{margin:0 0 6px;font-size:17px}
#mbox label{display:block;font-size:12px;color:var(--sub);margin:10px 0 0}
#mbox input[type=text],#mbox input[type=date],#mbox select{display:block;width:100%;min-height:44px;margin-top:4px;padding:0 12px;border:1px solid #CFCABD;border-radius:10px;font:inherit;font-size:15px;color:var(--ink);background:#fff}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1 1 110px}
.sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sec:first-of-type{margin-top:8px;padding-top:0;border-top:0}
.sec h4{margin:0 0 4px;font-size:13px}
.note{font-size:11px;color:var(--sub);line-height:1.6;margin:4px 0 0;white-space:pre-line}
.prev{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#ECE8DD;flex:none}
.chip{border:1px solid #CFCABD;background:#fff;border-radius:999px;min-height:36px;padding:0 12px;font:inherit;font-size:13px;margin:4px 6px 0 0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.shead{display:flex;gap:12px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
#logbox{margin:6px 0 0;padding:8px;background:#F1EEE6;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;min-height:20px}
#detail,#mis,#game,#brief{position:fixed;left:0;right:0;top:0;bottom:0;z-index:25;background:var(--bg);display:none;flex-direction:column}
#detail.open,#mis.open,#game.open,#brief.open{display:flex}
#dtop{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg)}
.lnk{min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--teal);font:inherit;font-size:14px;font-weight:700}
#dbody,#mbody,#gbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;color:inherit}
.pill{display:inline-block;font-size:13px;background:#F1EEE6;padding:4px 10px;border-radius:999px;margin:0 6px 6px 0}
.pill.bad{background:#FBE7E4;color:#8A1F14}
.dh{margin:0 0 8px;font-size:15px}
#mbody{padding-bottom:110px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-top:14px}
.sq{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 2px;text-align:center;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:inherit}
.sq.person{cursor:pointer}
.sq.cur{border:2px solid #E08A00;box-shadow:0 0 0 3px rgba(224,138,0,.25);background:#FFF8E8}
.sq.start{background:#1F7A6D;color:#fff;border-color:#1F7A6D}
.sq .no{font-size:9px;color:var(--sub)}.sq.start .no{color:#fff}
.sq .av{width:34px;height:34px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.sq .nm{font-size:10px;line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sq .bd{font-size:11px;min-height:13px}
.tok{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:20px;z-index:2;animation:bob .6s infinite alternate}
@keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-4px)}}
.die{display:inline-grid;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(3,22px);gap:6px;padding:14px;background:#fff;border:3px solid #1F2A2E;border-radius:22px;box-shadow:0 6px 0 #1F2A2E}
.die i{width:22px;height:22px;border-radius:50%}.die i.on{background:#C2185B}
#dicebox{display:inline-block;margin:6px 0 16px}
#dicebox.shake{animation:shake .18s infinite}
@keyframes shake{0%{transform:rotate(-12deg) scale(1.05)}50%{transform:rotate(12deg) scale(.95)}100%{transform:rotate(-12deg) scale(1.05)}}
.rollbtn{display:block;width:100%;min-height:56px;border:0;border-radius:16px;background:linear-gradient(#FFB74D,#F57C00);color:#fff;font:inherit;font-size:17px;font-weight:800;box-shadow:0 4px 0 #B55A00}
.rollbtn:disabled{background:#CFCABD;box-shadow:0 4px 0 #A8A292}
#brief{color:#fff}
.bhead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 10px}
.blnk{min-height:44px;padding:0 8px;border:0;background:transparent;color:#fff;font:inherit;font-size:14px;font-weight:700}
.bno{font-size:12px;font-weight:800;letter-spacing:.22em;opacity:.92}
#bbody{flex:1;min-height:0;overflow-y:auto;padding:4px 18px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.btaunt{font-size:26px;font-weight:800;font-style:italic;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.bcard{background:rgba(255,255,255,.96);color:var(--ink);border-radius:18px;padding:14px}
.bmemo{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.8}
.brew{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.brew span{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.bact{display:flex;flex-direction:column;gap:10px}
.bgo{min-height:58px;border:0;border-radius:16px;background:linear-gradient(#FFE08A,#FFC247);color:#5B3A00;font:inherit;font-size:16px;font-weight:800;box-shadow:0 4px 0 #C98A00;width:100%}
.bgo2{min-height:48px;border:2px solid rgba(255,255,255,.7);border-radius:14px;background:transparent;color:#fff;font:inherit;font-size:14px;font-weight:700;width:100%}
.binput{width:100%;min-height:52px;border-radius:12px;border:0;padding:0 14px;font:inherit;font-size:15px;color:var(--ink)}
.splash{position:fixed;left:0;right:0;top:0;bottom:0;z-index:70;background:rgba(15,20,22,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:spfade 1.45s forwards;border-top:8px solid var(--ac);border-bottom:8px solid var(--ac)}
.sp1{font-size:44px;font-weight:900;letter-spacing:.12em;font-style:italic;animation:spin .5s cubic-bezier(.2,1.2,.4,1)}
.sp2{font-size:18px;font-weight:700;margin-top:10px;animation:spin2 .7s .2s both}
@keyframes spin{from{transform:translateX(-120%) skewX(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spin2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spfade{0%,72%{opacity:1}100%{opacity:0}}
.cork{background:#EFE3CC;border-radius:18px;padding:20px 12px 16px;display:flex;flex-direction:column;gap:22px}
.poster{position:relative;background:#FFFDF6;border:2px solid var(--ac);border-radius:14px;padding:12px 12px 10px;box-shadow:0 4px 10px rgba(31,42,46,.14);text-align:left}
.poster:before{content:"";position:absolute;left:4px;right:4px;top:4px;bottom:4px;border:1px dashed rgba(0,0,0,.12);border-radius:10px;pointer-events:none}
.poster.on{background:#FFF4D6}
.poster .pin{position:absolute;top:-13px;left:50%;margin-left:-10px;font-size:20px}
.ribbon{position:absolute;right:-6px;top:10px;background:#E53935;color:#fff;font-size:11px;font-weight:800;padding:2px 10px;border-radius:6px 0 0 6px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.pdiff{font-size:11px;font-weight:800;color:#8A4B08}
.ptaunt{font-size:12px;font-weight:800;color:#fff;background:var(--ac);padding:2px 10px;border-radius:999px;font-style:italic;white-space:nowrap}
.pbody{display:flex;gap:12px;align-items:center;margin-top:8px}
.ptag{font-size:11px;font-weight:800;color:var(--ac)}
.ptitle{font-size:15px;font-weight:800;line-height:1.35;word-break:break-all}
.pcopy{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.prew{font-size:12px;font-weight:800;color:#6B3A00;background:linear-gradient(#FFE08A,#FFC247);padding:4px 10px;border-radius:999px}
.pgo{border-radius:999px;background:var(--ac);color:#fff;font-size:13px;font-weight:800;padding:8px 14px;white-space:nowrap}
.btn.ico{flex:0 0 56px;display:flex;align-items:center;justify-content:center;padding:0}
#b_dice{position:relative;margin-left:auto;flex:none;min-height:34px;padding:0 12px;font-size:15px}
.dot{position:absolute;top:3px;right:5px;width:9px;height:9px;border-radius:50%;background:#E53935}
#stat{position:absolute;right:8px;top:8px;z-index:2;background:rgba(255,255,255,.88);padding:2px 6px;border-radius:8px;font-size:10px;color:var(--sub)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--teal);background:#fff;flex:none;padding:0;color:#fff;font-size:16px;font-weight:700}
.chk.on{background:var(--teal)}
.mtxt{flex:1;min-width:0;text-align:left;border:0;background:transparent;font:inherit;color:inherit;padding:0}
.ptag{font-size:12px;font-weight:700;color:var(--amber);background:#FDF3E3;padding:4px 8px;border-radius:999px;flex:none}
.fab{position:absolute;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 12px rgba(31,42,46,.25)}
#strchip{position:absolute;left:8px;top:8px;z-index:2;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font:inherit;font-size:11px;line-height:1.4;color:var(--ink);text-align:left}
#strchip small{color:var(--sub);font-size:10px}
.hero{background:linear-gradient(150deg,#C2185B 0%,#6B3FA0 55%,#1F2A2E 100%);color:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 16px rgba(107,63,160,.35)}
.hero .hrank{color:#FFE08A;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.rpath{display:flex;align-items:center;margin:12px 0 4px}
.rpath .rk{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(255,255,255,.14);filter:grayscale(1) opacity(.55)}
.rpath .rk.past{background:#FFD54A;filter:none}
.rpath .rk.now{background:#FFD54A;filter:none;box-shadow:0 0 0 4px rgba(255,213,74,.35),0 0 18px rgba(255,213,74,.8);transform:scale(1.18)}
.rpath .rl{flex:1;height:3px;background:rgba(255,255,255,.25);margin:0 2px}
.hchips{display:flex;gap:8px;margin-top:10px}
.hchips span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.hero .hsm{font-size:12px;opacity:.92}
.hrank{font-size:22px;font-weight:700;margin-top:2px}
.xpbar{height:10px;border-radius:999px;background:rgba(255,255,255,.3);margin:10px 0 6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#FFE08A,#FFC247);border-radius:999px;box-shadow:0 0 10px rgba(255,213,74,.8)}
.streak{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;align-self:flex-start;white-space:nowrap}
.qcard{background:#fff;border:1px solid var(--line);border-left:6px solid var(--ac);border-radius:18px;padding:12px;box-shadow:0 2px 8px rgba(31,42,46,.06)}
.qcard.done{background:#F3F1EA;border-left-color:#B8B2A3}
.qtop{display:flex;align-items:center;gap:12px}
.qicon{width:48px;height:48px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.qtag{font-size:11px;font-weight:700;color:var(--ac)}
.qtitle{font-size:15px;font-weight:700;margin-top:1px;word-break:break-all}
.qsub{font-size:12px;color:var(--sub);margin-top:2px}
.qpts{flex:none;text-align:center;background:linear-gradient(#FFE08A,#FFC247);color:#6B3A00;border-radius:14px;padding:6px 10px;font-weight:800;font-size:17px;line-height:1.1}
.qpts small{display:block;font-size:10px;font-weight:700}
.qacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qgo{flex:1 1 140px;min-height:44px;border-radius:12px;border:0;background:var(--ac);color:#fff;font:inherit;font-size:14px;font-weight:700}
.qalt{flex:1 1 100px;min-height:44px;border-radius:12px;border:1px solid var(--ac);background:#fff;color:var(--ac);font:inherit;font-size:13px;font-weight:700}
.qdone{flex:1 1 100px;min-height:44px;border-radius:12px;border:0;background:#FFD54A;color:#5B3A00;font:inherit;font-size:14px;font-weight:800}
.newb{background:#E53935;color:#fff;border-radius:6px;padding:1px 5px;font-size:10px}
.cele{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cbox{background:#fff;border-radius:24px;padding:22px 32px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:cpop .5s cubic-bezier(.2,1.4,.4,1)}
.ct{font-size:18px;font-weight:800;margin-top:4px}.cp{font-size:36px;font-weight:800;color:#C2610C}.cr{margin-top:6px;font-size:14px;font-weight:700;color:#1F7A6D}
@keyframes cpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cbox{animation:none}}
#b_mis{flex:none;min-height:40px;padding:0 14px 0 10px;font-size:13px;margin-left:8px;display:flex;align-items:center;gap:6px;position:relative;background:linear-gradient(#FFE08A,#FFC247);border:0;color:#5B3A00;box-shadow:0 3px 0 #C98A00;border-radius:999px}
#b_mis:active{transform:translateY(2px);box-shadow:0 1px 0 #C98A00}
#b_mis .mi{font-size:16px}
#b_mis .mb{min-width:20px;height:20px;border-radius:10px;background:#E53935;color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px}
#b_mis.hot{animation:mpulse 2.4s ease-in-out infinite}
@keyframes mpulse{0%,100%{box-shadow:0 3px 0 #C98A00,0 0 0 0 rgba(255,194,71,.55)}50%{box-shadow:0 3px 0 #C98A00,0 0 0 8px rgba(255,194,71,0)}}
@media (prefers-reduced-motion:reduce){#b_mis.hot{animation:none}}
button.pill{border:0;font-family:inherit}
#mbox input[type=number]{display:block;width:100%;min-height:44px;margin-top:4px;padding:0 12px;border:1px solid #CFCABD;border-radius:10px;font:inherit;font-size:15px;color:var(--ink);background:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:max-content;background:#1F2A2E;color:#fff;padding:10px 14px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#fatal{display:none;padding:20px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<header><h1>つながり図鑑</h1><button class="btn" id="b_dice" aria-label="つながり双六">🎲</button><button class="btn primary" id="b_mis">ミッション</button></header>
<div id="fatal"></div>
<div id="stage">
  <canvas id="gcv"></canvas>
  <div id="graph"></div>
  <canvas id="lasso"></canvas>
  <div id="lbar"><b>⭕ 指でぐるっと囲んでください</b><br>囲んだ人をグループにできます<div class="lb"><button id="l_pick">名前で選ぶ</button><button id="l_cancel">やめる</button></div></div>
  <small id="stat"></small>
  <button id="strchip" aria-label="つながりの強さの表示を切り替える"></button>
  <button id="b_guide" aria-label="ガイドのポムに教えてあげる"></button>
  <div id="banner"></div>
  <div id="hint">人物を長押しして、つなぐ相手をタップすると線がひけます。<br>下の「＋ 人物」から追加できます。</div>
</div>
<nav id="bar">
  <button class="btn primary" id="b_add">＋ 人物</button>
  <button class="btn ico" id="b_undo" aria-label="ひとつ前に戻る"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="btn ico" id="b_redo" aria-label="やり直す（進む）"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button class="btn" id="b_grp" aria-label="枠で囲ってグループを作る">⭕ 囲む</button>
  <button class="btn" id="b_data">データ</button>
</nav>
<div id="sheet" role="dialog" aria-label="人物の情報"></div>
<div id="mis" role="dialog" aria-label="ミッション"></div>
<div id="game" role="dialog" aria-label="つながり双六"></div>
<div id="brief" role="dialog" aria-label="ミッションの指令"></div>
<div id="detail" role="dialog" aria-label="人物の詳細"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<script>
(function(){
'use strict';

/* ---------- 基本 ---------- */
var APP_VER='試作 v0.9';
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var pad=function(n){return String(n).padStart(2,'0');};
var stamp=function(){var d=new Date();return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());};
var kb=function(b){return Math.max(1,Math.round(b.size/1024))+'KB';};
var txt=function(v){return v==null?'':String(v).trim();};
var num=function(v){if(v===''||v==null)return null;var n=Number(v);return isFinite(n)?n:null;};

var CATS={
  self:{label:'自分',bg:'#1F7A6D',fg:'#FFFFFF'},
  family:{label:'家族',bg:'#F6E3D6',fg:'#7A3B12'},
  friend:{label:'友人',bg:'#DCEFEA',fg:'#14564C'},
  work:{label:'仕事',bg:'#E3E4F5',fg:'#2B2F7A'},
  other:{label:'その他',bg:'#ECE8DD',fg:'#3F4A4F'}
};
var CAT_BY_LABEL={};Object.keys(CATS).forEach(function(k){CAT_BY_LABEL[CATS[k].label]=k;});
var COLORS={'グレー':'#8A8577','緑':'#1F7A6D','青':'#2B5FB0','オレンジ':'#C2610C','赤':'#B3261E','紫':'#6B3FA0'};
var COLOR_NAME_BY_HEX={};Object.keys(COLORS).forEach(function(k){COLOR_NAME_BY_HEX[COLORS[k]]=k;});
var XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

/* ---------- 状態 ---------- */
var state={people:[],rels:[],contacts:[],gifts:[],missions:[],topics:[],settings:{}};   // people:{id,name,cat,birthday,memo,likes,dislikes,next,x,y} rels:{id,a,b,label,dir,color} contacts:{id,pid,date,kind,note} gifts:{id,pid,date,dir,item,occasion}
var photos={};                    // 人物id -> 画像データ(dataURL)
var cy=null,hist=[],hidx=-1,linkFrom=null,justHeld=false,lastSaved=null,persisted=null;
var logs=[],detailId=null;

function normState(s){
  s.people.forEach(function(p){p.likes=p.likes||'';p.dislikes=p.dislikes||'';p.next=p.next||'';});
  var mxn=0;s.people.forEach(function(p){if(+p.no>mxn)mxn=+p.no;});
  s.people.forEach(function(p){if(p.cat!=='self'&&!(+p.no>0))p.no=++mxn;});
  s.rels=Array.isArray(s.rels)?s.rels:[];s.contacts=Array.isArray(s.contacts)?s.contacts:[];s.gifts=Array.isArray(s.gifts)?s.gifts:[];
  s.groups=(Array.isArray(s.groups)?s.groups:[]).filter(function(g){return g&&Array.isArray(g.members);});s.groups.forEach(function(g){g.id=g.id||uid();g.name=g.name||'グループ';g.color=g.color||'#3F7FD8';});s.missions=Array.isArray(s.missions)?s.missions:[];s.topics=Array.isArray(s.topics)?s.topics:[];
  var st=s.settings&&typeof s.settings==='object'?s.settings:{};
  st.pts=Object.assign({topic:15,birthday:20,gift:15,gap:10,next:10,custom:10,discover:15,card:10},st.pts||{});
  st.ghostDays=+st.ghostDays>0?+st.ghostDays:60;
  st.game=Object.assign({pos:0,tickets:0,lastFree:'',laps:0,bonus:0,done:{},doneInit:false,lastDice:0,totalRolls:0},st.game||{});
  st.game.done=st.game.done||{};
  st.gapDays=+st.gapDays>0?+st.gapDays:30;st.bdLead=+st.bdLead>0?+st.bdLead:14;st.last=st.last||null;st.showStrength=st.showStrength!==false;s.settings=st;
  return s;
}
function initialState(){return normState({people:[{id:uid(),name:'自分',cat:'self',birthday:'',memo:'',x:0,y:0}],rels:[]});}
function nameOf(id){var p=state.people.find(function(x){return x.id===id;});return p?p.name:'?';}
function addLog(m){var d=new Date();logs.push(pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' '+m);while(logs.length>10)logs.shift();var el=$('logbox');if(el)el.textContent=logs.join('\n');}
function toast(m,ms){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},ms||2600);}

/* ---------- 保存（IndexedDB） ---------- */
var dbp=null;
function idb(){return dbp||(dbp=new Promise(function(res,rej){var r=indexedDB.open('tsunagari-proto',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}));}
function kvGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});});}
function kvSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error);};});});}
function keepPhotos(){var keep={};state.people.forEach(function(p){if(photos[p.id])keep[p.id]=photos[p.id];});return keep;}
function save(){
  lastSaved=Date.now();
  return kvSet('data',{state:state,photos:keepPhotos(),savedAt:lastSaved}).then(updateUi).catch(function(e){addLog('保存に失敗：'+e.message);toast('保存に失敗しました');});
}

/* ---------- 元に戻す／やり直す ---------- */
function snap(){hist=hist.slice(0,hidx+1);hist.push(JSON.stringify(state));if(hist.length>60)hist.shift();hidx=hist.length-1;}
function commit(){cleanGroups();var nb=checkComplete();snap();save();updateUi();if(detailId)renderDetail();if($('mis').classList.contains('open'))renderMissions();if($('game').classList.contains('open'))renderGame();if($('brief').classList.contains('open'))renderBrief();applyStrength();refreshLabels();if(nb.length)celebrate(30*nb.length,'📖 図鑑コンプリート！',nb.join('・'));}
function undo(){if(hidx>0){hidx--;state=JSON.parse(hist[hidx]);closeSheet();cancelLink();render();save();}}
function redo(){if(hidx<hist.length-1){hidx++;state=JSON.parse(hist[hidx]);closeSheet();cancelLink();render();save();}}

/* ---------- 図の描画 ---------- */
function placeholder(p){
  var c=CATS[p.cat]||CATS.other;
  var ch=Array.from(String(p.name||'?').trim())[0]||'?';
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="'+c.bg+'"/><text x="60" y="62" text-anchor="middle" dominant-baseline="central" font-size="'+(p.cat==='self'?44:56)+'" font-weight="700" font-family="sans-serif" fill="'+c.fg+'">'+esc(p.cat==='self'?'自分':ch)+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function avatarSrc(p){return photos[p.id]||placeholder(p);}

function initCy(){
  cy=cytoscape({
    container:$('graph'),elements:[],minZoom:0.2,maxZoom:3,
    autounselectify:true,boxSelectionEnabled:false,
    style:[
      {selector:'node',style:{'width':56,'height':56,'shape':'ellipse','background-color':'#ECE8DD','background-image':'data(img)','background-fit':'cover','background-clip':'node','border-width':3,'border-color':'data(border)','label':'data(label)','font-size':12,'font-family':'sans-serif','text-valign':'bottom','text-margin-y':6,'color':'#1F2A2E','text-wrap':'ellipsis','text-max-width':96,'text-background-color':'#ffffff','text-background-opacity':0.85,'text-background-padding':2}},
      {selector:'node[cat = "self"]',style:{'width':68,'height':68}},
      {selector:'node.active',style:{'border-color':'#E08A00','border-width':5}},
      {selector:'node.linksrc',style:{'border-color':'#E08A00','border-width':6}},
      {selector:'edge',style:{'width':'data(w)','line-opacity':'data(op)','line-color':'data(color)','curve-style':'unbundled-bezier','control-point-distances':[26],'control-point-weights':[0.5],'label':'data(label)','font-size':11,'font-family':'sans-serif','color':'#3F4A4F','text-background-color':'#ffffff','text-background-opacity':0.9,'text-background-padding':2,'text-rotation':'autorotate','text-events':'yes','target-arrow-color':'data(color)','source-arrow-color':'data(color)','arrow-scale':'data(as)'}},
      {selector:'edge[dir = "one"]',style:{'target-arrow-shape':'triangle'}},
      {selector:'edge[dir = "both"]',style:{'target-arrow-shape':'triangle','source-arrow-shape':'triangle'}}
    ]
  });
  cy.on('tap','node',function(e){
    if(justHeld)return;
    var id=e.target.id();
    if(linkFrom){
      if(id===linkFrom){cancelLink();return;}
      var a=linkFrom;cancelLink();openEdgeModal({a:a,b:id});
    }else{openNodeSheet(id);}
  });
  cy.on('tap','edge',function(e){if(justHeld||linkFrom)return;openEdgeModal({edgeId:e.target.id()});});
  cy.on('render',function(){if(window.__gq)return;window.__gq=requestAnimationFrame(function(){window.__gq=0;drawGroups();});});
  cy.on('tap',function(e){if(e.target===cy){if(linkFrom){cancelLink();closeSheet();return;}closeSheet();var z=cy.zoom(),pn=cy.pan(),gg=groupAt((e.renderedPosition.x-pn.x)/z,(e.renderedPosition.y-pn.y)/z);if(gg)openGroupModal(gg.id);}});
  cy.on('taphold','node',function(e){startLink(e.target.id());justHeld=true;setTimeout(function(){justHeld=false;},700);});
  cy.on('dragfree','node',function(){
    var changed=false;
    cy.nodes().forEach(function(n){
      var p=state.people.find(function(x){return x.id===n.id();});if(!p)return;
      var pos=n.position();
      if(Math.abs(p.x-pos.x)>0.5||Math.abs(p.y-pos.y)>0.5){p.x=pos.x;p.y=pos.y;changed=true;}
    });
    if(changed)commit();
  });
}

function render(){
  var ids={};state.people.forEach(function(p){ids[p.id]=1;});
  var els=[];
  state.people.forEach(function(p){
    els.push({group:'nodes',data:{id:p.id,label:labelFor(p),cat:p.cat,img:avatarSrc(p),border:borderOf(p)},position:{x:p.x,y:p.y}});
  });
  var seenPair={};
  state.rels.forEach(function(r){
    if(!(ids[r.a]&&ids[r.b]))return;
    var key=[r.a,r.b].sort().join('|'),k=seenPair[key]||0;seenPair[key]=k+1;
    // 同じ2人の間に何本線があっても重ならないよう、曲がり具合を少しずつ変える
    var mag=26+34*Math.floor(k/2),side=(k%2?-1:1)*(r.a<r.b?1:-1);
    els.push({group:'edges',data:{id:r.id,source:r.a,target:r.b,label:r.label||'',dir:r.dir||'none',color:r.color||COLORS['グレー'],cp:side*mag,w:3,op:1,as:1.3}});
  });
  cy.batch(function(){
    cy.elements().remove();cy.add(els);
    cy.edges().forEach(function(e){e.style('control-point-distances',String(e.data('cp')));});
  });
  applyStrength();
  drawGroups();
  updateUi();
}
function fitView(){if(!cy)return;if(state.people.length<=2){cy.zoom(1);cy.center();}else{cy.fit(undefined,50);}}
function updateUi(){
  $('b_undo').disabled=!(hidx>0);
  $('b_redo').disabled=!(hidx<hist.length-1);
  var on=state.missions.filter(function(m){return m.status!=='done';}).length;$('b_mis').innerHTML='<span class="mi">⚔️</span><span>ミッション</span>'+(on?'<span class="mb">'+on+'</span>':'');$('b_mis').classList.toggle('hot',on>0);$('b_dice').innerHTML='🎲'+((state.people.length>1&&canRoll())?'<span class="dot"></span>':'');
  var sc=$('strchip'),son=state.settings.showStrength!==false;sc.style.display=state.people.length>1?'block':'none';sc.innerHTML=son?'<b>つながりの強さ：表示中</b><br><small>太く濃い線＝最近よく交流</small>':'<b>つながりの強さ：非表示</b><br><small>タップで表示</small>';
  $('hint').style.display=state.people.length<=1?'block':'none';updateGuideBtn();
  var t=lastSaved?pad(new Date(lastSaved).getHours())+':'+pad(new Date(lastSaved).getMinutes()):'-';
  $('stat').textContent=state.people.length+'人・線'+state.rels.length+'本・保存'+t;
}

/* ---------- シート・モーダル ---------- */
function showModal(html){$('mbox').innerHTML=html;$('modal').classList.add('open');$('mbox').scrollTop=0;}
function closeModal(){$('modal').classList.remove('open');$('mbox').innerHTML='';pendingMid=null;}
function closeSheet(){$('sheet').classList.remove('open');if(cy)cy.nodes().removeClass('active');}
function startLink(id){
  linkFrom=id;closeSheet();cy.getElementById(id).addClass('linksrc');
  $('banner').textContent=nameOf(id)+' から：つなぐ相手をタップ（余白をタップでやめる）';
  $('banner').classList.add('show');
}
function cancelLink(){
  if(linkFrom&&cy){var n=cy.getElementById(linkFrom);if(n.length)n.removeClass('linksrc');}
  linkFrom=null;$('banner').classList.remove('show');
}

function openNodeSheet(id){
  var p=state.people.find(function(x){return x.id===id;});if(!p)return;
  cy.nodes().removeClass('active');cy.getElementById(id).addClass('active');
  var c=CATS[p.cat]||CATS.other;
  var rels=state.rels.filter(function(r){return r.a===id||r.b===id;});
  var chips=rels.map(function(r){var other=r.a===id?r.b:r.a;return '<button class="chip" data-e="'+esc(r.id)+'">'+esc(nameOf(other))+'（'+esc(r.label||'関係なし')+'）</button>';}).join('');
  $('sheet').innerHTML=
    '<div class="shead"><img class="avatar" alt="" src="'+esc(avatarSrc(p))+'"><div><div style="font-size:18px;font-weight:700">'+esc(p.name)+'</div>'+
    '<span class="tag" style="background:'+c.bg+';color:'+(c.fg==='#FFFFFF'?'#1F7A6D':c.fg)+(p.cat==='self'?';border:1px solid #1F7A6D':'')+'">'+esc(c.label)+'</span>'+
    (p.birthday?' <span style="font-size:12px;color:#5B6468">誕生日 '+esc(p.birthday)+'</span>'+ageSpan(p):'')+gchips(id)+'</div></div>'+
    (p.memo?'<p class="note" style="font-size:13px;color:#1F2A2E">'+esc(p.memo)+'</p>':'')+
    (p.cat==='self'?'':'<div style="margin-top:8px;font-size:12px;color:#5B6468">つながりの強さ　'+gauge(strengthOf(id).level)+' '+LV_NAMES[strengthOf(id).level]+'</div>')+(p.cat==='self'?'':'<div style="margin-top:4px;font-size:12px;color:#5B6468">📖 図鑑 No.'+(p.no||'-')+'　'+compCount(p)+'/6'+(ghostDays(p)?'　👻 ごぶさた':'')+'</div>')+
    '<div style="margin-top:10px;font-size:12px;color:#5B6468">つながり（タップで編集）</div><div>'+(chips||'<span class="note">まだありません</span>')+'</div>'+
    '<div class="row"><button class="btn primary" id="s_detail">詳しく見る</button><button class="btn" id="s_link">ここからつなぐ</button></div><div class="row" style="margin-top:8px"><button class="btn" id="s_edit">編集</button><button class="btn" id="s_close">閉じる</button></div>';
  $('sheet').classList.add('open');
  $('s_detail').onclick=function(){openDetail(id);};
  $('s_link').onclick=function(){startLink(id);};
  $('s_edit').onclick=function(){closeSheet();openPersonModal(id);};
  $('s_close').onclick=closeSheet;
  Array.prototype.forEach.call($('sheet').querySelectorAll('[data-e]'),function(b){b.onclick=function(){closeSheet();openEdgeModal({edgeId:b.getAttribute('data-e')});};});
}

/* ---------- 人物詳細（交流・贈り物） ---------- */
var KINDS=['対面','電話','LINE','メール','その他'];
function todayStr(back){var d=new Date();d.setDate(d.getDate()-(back||0));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayDiff(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return null;var a=new Date(+m[1],+m[2]-1,+m[3]),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((n-a)/86400000);}
function dateLabel(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return s||'';return (+m[1]===new Date().getFullYear()?'':m[1]+'/')+(+m[2])+'/'+(+m[3]);}
function agoLabel(n){if(n==null)return '';if(n<0)return (-n)+'日後';if(n===0)return '今日';return n+'日前';}
function tagsOf(s){return String(s||'').split(/[、,，\/／\n]+/).map(function(x){return x.trim();}).filter(Boolean);}
function byDateDesc(a,b){return String(b.date||'').localeCompare(String(a.date||''));}
function lastContact(pid){var best=null;state.contacts.forEach(function(c){var d=dayDiff(c.date);if(c.pid===pid&&d!=null&&d>=0&&(!best||c.date>best))best=c.date;});return best;}
function openDetail(id){detailId=id;closeSheet();renderDetail();$('detail').classList.add('open');}
function closeDetail(){detailId=null;$('detail').classList.remove('open');$('detail').innerHTML='';}
function renderDetail(){
  var p=state.people.find(function(x){return x.id===detailId;});
  if(!p){closeDetail();return;}
  var id=p.id,c=CATS[p.cat]||CATS.other,isSelf=p.cat==='self';
  var old=$('dbody'),top=old?old.scrollTop:0;
  var lc=lastContact(id);
  var rels=state.rels.filter(function(r){return r.a===id||r.b===id;}).map(function(r){var o=r.a===id?r.b:r.a;return '<button class="chip" data-e="'+esc(r.id)+'">'+esc(nameOf(o))+'（'+esc(r.label||'関係なし')+'）</button>';}).join('');
  var cs=state.contacts.filter(function(x){return x.pid===id;}).sort(byDateDesc);
  var gs=state.gifts.filter(function(x){return x.pid===id;}).sort(byDateDesc);
  var likes=tagsOf(p.likes).map(function(t){return isSelf?'<span class="pill">'+esc(t)+'</span>':'<button class="pill" data-like="'+esc(t)+'">'+esc(t)+'</button>';}).join('');
  if(likes&&!isSelf)likes+='<div class="note" style="margin:0 0 4px">タップすると、ミッションになって検索が開きます</div>';
  var ts=state.topics.filter(function(x){return x.pid===id;}).sort(byDateDesc);
  var topicsHtml='<div><div style="display:flex;justify-content:space-between;align-items:center"><h4 class="dh" style="margin:0">話題ストック</h4><button class="lnk" id="d_addt" style="min-height:36px">＋追加</button></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">'+
    (ts.length?ts.map(function(x){return '<div class="item" style="align-items:center"><button class="mtxt" data-t="'+esc(x.id)+'"><b style="font-size:14px">'+esc(x.title)+'</b><span class="note" style="display:block;margin:2px 0 0;white-space:normal">'+esc([dateLabel(x.date),x.note].filter(Boolean).join('　'))+'</span></button>'+(/^https?:\/\//i.test(x.url||'')?'<button class="lnk" data-open="'+esc(x.url)+'" style="min-height:36px">開く</button>':'')+'</div>';}).join(''):'<span class="note">まだありません。ミッションで見つけた記事を、ここにためます。</span>')+'</div></div>';
  var dislikes=tagsOf(p.dislikes).map(function(t){return '<span class="pill bad">'+esc(t)+'</span>';}).join('');
  var h='<div id="dtop"><button class="lnk" id="d_back">‹ 相関図</button><button class="lnk" id="d_edit">編集</button></div><div id="dbody">'+
   '<div class="shead" style="gap:14px"><img class="avatar" style="width:64px;height:64px" alt="" src="'+esc(avatarSrc(p))+'"><div><div style="font-size:22px;font-weight:700">'+esc(p.name)+'</div>'+

function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseMD(s){
  s=String(s||'');
  var m=/(\d{4})\s*[-\/.年]\s*(\d{1,2})\s*[-\/.月]\s*(\d{1,2})/.exec(s);
  if(m)return {m:+m[2],d:+m[3]};
  m=/(?<!\d)(\d{1,2})\s*[月\/]\s*(\d{1,2})(?!\d)/.exec(s);
  return m?{m:+m[1],d:+m[2]}:null;
}
function nextBirthday(s){
  var md=parseMD(s);if(!md||md.m<1||md.m>12||md.d<1||md.d>31)return null;
  var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var d=new Date(t.getFullYear(),md.m-1,md.d);if(d<t)d=new Date(t.getFullYear()+1,md.m-1,md.d);
  return {date:d,days:Math.round((d-t)/86400000)};
}

var LV_NAMES=['記録なし','ゆるい','ほどよい','しっかり','強い','とても強い'];
function strengthOf(pid){
  var sc=0,nc=0,ng=0,nt=0,nm=0;
  state.contacts.forEach(function(c){if(c.pid!==pid)return;var d=dayDiff(c.date);if(d==null||d<0||d>180)return;sc+=3*(1-d/180);nc++;});
  state.gifts.forEach(function(g){if(g.pid!==pid)return;var d=dayDiff(g.date);if(d==null||d<0||d>365)return;sc+=2*(1-d/365);ng++;});
  state.topics.forEach(function(t){if(t.pid!==pid)return;var d=dayDiff(t.date);if(d==null||d<0||d>180)return;sc+=1.5*(1-d/180);nt++;});
  state.missions.forEach(function(m){if(m.pid!==pid||isOpen(m))return;var d=dayDiff(m.doneAt);if(d==null||d<0||d>180)return;sc+=2*(1-d/180);nm++;});
  var lv=sc<=0?0:sc<1.5?1:sc<3.5?2:sc<6?3:sc<9?4:5;
  return {score:sc,level:lv,nc:nc,ng:ng,nt:nt,nm:nm};
}
function gauge(lv){var h='<span style="display:inline-flex;gap:3px;vertical-align:middle">';for(var i=1;i<=5;i++)h+='<span style="width:14px;height:8px;border-radius:3px;background:'+(i<=lv?'#1F7A6D':'#E4E0D6')+'"></span>';return h+'</span>';}
function strengthCard(pid){

    '<div class="note" style="white-space:normal">半年以内の記録：交流 '+s.nc+'回・贈り物 '+s.ng+'回・話題 '+s.nt+'件・達成ミッション '+s.nm+'件。記録やミッションを重ねるほど、相関図の「自分」とつなぐ線が太く濃くなります。</div></div>';

function applyStrength(){
  if(!cy)return;

  cy.batch(function(){

function drawCard(p){
  var st=state.settings,c=[];
  var blanks=[];if(!p.likes)blanks.push(['likes','好きなもの']);if(!p.dislikes)blanks.push(['dislikes','苦手なもの']);if(!p.birthday)blanks.push(['birthday','誕生日']);

  var lc=lastContact(p.id);
  if(lc&&dayDiff(lc)>=st.gapDays)c.push({w:4,f:function(){return {type:'gap',tag:'',key:'gap|'+p.id+'|'+lc,title:p.name+'に近況を聞いてみる',due:''};}});
  var nb=nextBirthday(p.birthday);
  if(nb&&nb.days<=st.bdLead)c.push({w:5,f:function(){return {type:'birthday',tag:'',key:'birthday|'+p.id+'|'+nb.date.getFullYear(),title:p.name+'の誕生日にひとこと送る',due:ymd(nb.date)};}});
  var tags=tagsOf(p.likes);
  if(tags.length)c.push({w:2,f:function(){var t=tags[Math.floor(Math.random()*tags.length)];return {type:'topic',tag:t,key:'topic|'+p.id+'|'+t,title:p.name+'の好き「'+t+'」で話題を見つける',due:''};}});
  c.push({w:2,f:function(){var T=['ありがとうを1つ伝えてみる','最近あった良いことを聞いてみる','おすすめのお店・本・動画を聞いてみる','昔の思い出話を1つしてみる','スタンプかひとことを送ってみる','最近ハマっていることを聞いてみる'];return {type:'card',tag:'',key:'',title:p.name+'に、'+T[Math.floor(Math.random()*T.length)],due:''};}});
  var tot=0;c.forEach(function(x){tot+=x.w;});
  var r=Math.random()*tot,pick=c[c.length-1];
  for(var i=0;i<c.length;i++){r-=c[i].w;if(r<0){pick=c[i];break;}}
  var spec=pick.f();
  var ex=spec.key?state.missions.find(function(m){return m.key===spec.key&&isOpen(m);}):null;
  if(ex)return {m:ex,again:true};

}

function readPhoto(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var S=200,c=document.createElement('canvas');c.width=S;c.height=S;
      var m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('画像を読めませんでした'));};
    im.src=url;
  });
}

      var d=new Date();g.fillStyle='#8A8577';g.font='24px sans-serif';g.textBaseline='middle';

/* ---------- グループ（枠で囲む） ---------- */
var GCOLS=[['ピンク','#E8628A'],['オレンジ','#F0922B'],['黄','#D9B000'],['緑','#3BAA6B'],['青','#3F7FD8'],['紫','#8B5FD0'],['グレー','#8A8577']];
var GCOL_BY_NAME={};GCOLS.forEach(function(c){GCOL_BY_NAME[c[0]]=c[1];});
function gcolName(hex){var f=GCOLS.filter(function(c){return c[1]===hex;})[0];return f?f[0]:'グレー';}
var GR=44,gTmp=null;
function cleanGroups(){
  var ids={};state.people.forEach(function(p){ids[p.id]=1;});
  state.groups=(state.groups||[]).filter(function(g){g.members=g.members.filter(function(id){return ids[id];});return g.members.length>0;});
}
function gPts(g){
  var out=[];g.members.forEach(function(id){var n=cy&&cy.getElementById(id);if(n&&n.length){var q=n.position();out.push({x:q.x,y:q.y});}});return out;
}
// メンバー全員を包む楕円（主軸は人の並びの向き）
function gEllipse(pts){
  var n=pts.length,cx=0,cy2=0;
  pts.forEach(function(p){cx+=p.x;cy2+=p.y;});cx/=n;cy2/=n;
  var sxx=0,syy=0,sxy=0;pts.forEach(function(p){var dx=p.x-cx,dy=p.y-cy2;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;});
  var th=n>1?0.5*Math.atan2(2*sxy,sxx-syy):0,c=Math.cos(th),s=Math.sin(th),mu=0,mv=0,us=[];
  pts.forEach(function(p){var dx=p.x-cx,dy=p.y-cy2,u=dx*c+dy*s,v=-dx*s+dy*c;us.push([u,v]);mu=Math.max(mu,Math.abs(u));mv=Math.max(mv,Math.abs(v));});
  var rho=Math.min(1,Math.max(0.6,(mv+GR)/(mu+GR))),a=GR;
  us.forEach(function(t){a=Math.max(a,Math.sqrt(t[0]*t[0]+(t[1]/rho)*(t[1]/rho))+GR);});
  var b=a*rho;
  return {x:cx,y:cy2,a:a,b:b,th:th};
}
// ctx: 描く先, W,H: 大きさ, tx: モデル座標→画面座標, k: 拡大率
function drawGroupsTo(ctx,W,H,tx,k){
  if(!state.groups||!state.groups.length)return;
  state.groups.forEach(function(g){
    var pts=gPts(g);if(!pts.length)return;
    var e=gEllipse(pts),q=tx(e.x,e.y);
    ctx.save();
    ctx.beginPath();ctx.ellipse(q[0],q[1],e.a*k,e.b*k,e.th,0,6.2832);
    ctx.globalAlpha=0.16;ctx.fillStyle=g.color;ctx.fill();
    ctx.globalAlpha=0.8;ctx.strokeStyle=g.color;ctx.lineWidth=Math.max(2,2.5*k);ctx.stroke();
    ctx.restore();
    var ym=Math.sqrt(e.a*e.a*Math.sin(e.th)*Math.sin(e.th)+e.b*e.b*Math.cos(e.th)*Math.cos(e.th));
    ctx.save();ctx.font='700 '+Math.max(12,Math.round(14*Math.max(k,0.9)))+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.fillStyle=g.color;
    var ty=q[1]-ym*k-3;ctx.strokeText(g.name,q[0],ty);ctx.fillText(g.name,q[0],ty);ctx.restore();
  });
}
function drawGroups(){
  var cv=$('gcv');if(!cv||!cy)return;
  var st=$('stage'),w=st.clientWidth,h=st.clientHeight,r=window.devicePixelRatio||1;
  if(cv.width!==Math.round(w*r)||cv.height!==Math.round(h*r)){cv.width=Math.round(w*r);cv.height=Math.round(h*r);}
  var c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);
  c.scale(r,r);
  var z=cy.zoom(),pan=cy.pan();
  drawGroupsTo(c,w,h,function(x,y){return [x*z+pan.x,y*z+pan.y];},z);
}
function groupAt(mx,my){
  for(var i=state.groups.length-1;i>=0;i--){
    var g=state.groups[i],pts=gPts(g);if(!pts.length)continue;
    var e=gEllipse(pts),dx=mx-e.x,dy=my-e.y,c=Math.cos(e.th),s=Math.sin(e.th),u=dx*c+dy*s,v=-dx*s+dy*c;
    if((u*u)/(e.a*e.a)+(v*v)/(e.b*e.b)<=1)return g;
  }
  return null;
}
// メンバーを近くに寄せる（重心まわりにコンパクトな並びにする）
function gatherGroup(g){
  var ms=g.members.map(function(id){return state.people.find(function(p){return p.id===id;});}).filter(Boolean);
  if(ms.length<2)return;
  var cx=0,cy2=0;ms.forEach(function(p){cx+=p.x;cy2+=p.y;});cx/=ms.length;cy2/=ms.length;
  var cols=Math.max(2,Math.ceil(Math.sqrt(ms.length*1.6))),SX=104,SY=92;
  ms.sort(function(a,b){return a.y-b.y;});
  var rows=[];for(var i=0;i<ms.length;i+=cols)rows.push(ms.slice(i,i+cols).sort(function(a,b){return a.x-b.x;}));
  rows.forEach(function(row,ri){
    row.forEach(function(p,ci){
      p.x=cx+(ci-(row.length-1)/2)*SX;p.y=cy2+(ri-(rows.length-1)/2)*SY;
      var n=cy.getElementById(p.id);if(n.length)n.position({x:p.x,y:p.y});
    });
  });
}
/* 囲みモード */
var lassoOn=false,lpts=[];
function startLasso(){
  if(state.people.length<2){toast('人物を2人以上追加してから使えます');return;}
  closeSheet();cancelLink();lassoOn=true;lpts=[];
  $('lasso').classList.add('on');$('lbar').classList.add('on');
  var c=$('lasso'),st=$('stage');c.width=st.clientWidth;c.height=st.clientHeight;c.getContext('2d').clearRect(0,0,c.width,c.height);
}
function stopLasso(){lassoOn=false;lpts=[];$('lasso').classList.remove('on');$('lbar').classList.remove('on');}
function inPoly(pt,poly){
  var ins=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    var xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>pt.y)!==(yj>pt.y))&&(pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi))ins=!ins;
  }
  return ins;
}
function lassoSelect(poly){
  var ids=[];cy.nodes().forEach(function(n){var q=n.renderedPosition();if(inPoly(q,poly))ids.push(n.id());});return ids;
}
function setupLasso(){
  var c=$('lasso'),drawing=false;
  function pt(e){var r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  c.addEventListener('pointerdown',function(e){drawing=true;lpts=[pt(e)];try{c.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
  c.addEventListener('pointermove',function(e){
    if(!drawing)return;lpts.push(pt(e));
    var g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
    g.lineWidth=5;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#E08A00';g.fillStyle='rgba(224,138,0,.12)';
    g.beginPath();lpts.forEach(function(p,i){if(i)g.lineTo(p.x,p.y);else g.moveTo(p.x,p.y);});g.closePath();g.fill();g.stroke();
    e.preventDefault();
  });
  function end(e){
    if(!drawing)return;drawing=false;
    var poly=lpts.slice();c.getContext('2d').clearRect(0,0,c.width,c.height);
    if(poly.length<8){toast('もう少し大きく、ぐるっと囲んでね');return;}
    var ids=lassoSelect(poly);
    if(!ids.length){toast('だれも入っていません。人物のまわりを囲んでね');return;}
    stopLasso();openGroupModal(null,ids);
  }
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  $('l_cancel').onclick=stopLasso;
  $('l_pick').onclick=function(){stopLasso();openGroupModal(null,[]);};
}

/* ---------- 年齢・グループ表示・ガイド「ポム」 ---------- */
function ageInfo(s){
  s=String(s||'');
  var m=/(?<!\d)(\d{4})\s*(?:[-\/.年]\s*(\d{1,2})(?:\s*[-\/.月]\s*(\d{1,2}))?)?/.exec(s);
  if(!m)return null;
  var y=+m[1];if(y<1900||y>2100)return null;

function guideSvg(px,mood){return '<img alt="ガイドのポム" width="'+px+'" height="'+px+'" src="'+HAM[mood||'ask']+'" style="flex:none;border-radius:50%">';}
var GQ={
  likes:['{n}って、お休みの日は何してる人？ 好きなものを教えて！','{n}の好きなものって何かな？ ポム、知りたいな！'],
  dislikes:['{n}の苦手なものって、ある？ 知っておくと気がきくよ！','{n}が「ちょっと苦手…」ってものは何だろう？'],
  birthday:['{n}の生まれた年は？ 誕生日もわかれば最高！（年だけでもOK）','{n}っていくつくらいかな？ 生まれた年か誕生日を教えて！'],
  memo:['{n}って、どんな人？ ひとことで教えて！','{n}の印象を、ひとことで言うと？']
};
var GPH={likes:'例：カフェ、映画',dislikes:'例：辛い物',birthday:'例：1994 / 3月14日 / 1994-03-14',memo:'例：いつも明るい、聞き上手'};
var GLABEL={likes:'好きなもの',dislikes:'苦手なもの',birthday:'誕生日',memo:'メモ'};
var gIdx=0;
function hash(str){var h=0;String(str).split('').forEach(function(c){h=(h*31+c.charCodeAt(0))>>>0;});return h;}
function guideCands(){
  var out=[],day=todayStr();
  state.people.forEach(function(p){
    if(p.cat==='self')return;
    ['likes','dislikes','birthday','memo'].forEach(function(f){if(!p[f])out.push({p:p,f:f});});
  });
  out.sort(function(a,b){return hash(day+a.p.id+a.f)-hash(day+b.p.id+b.f);});
  return out;
}
function guideText(c){var v=GQ[c.f];return v[hash(c.p.id+c.f)%v.length].replace('{n}',c.p.name);}
function updateGuideBtn(){
  var b=$('b_guide');if(!b)return;
  var n=state.people.length>1?guideCands().length:0;
  b.style.display=state.people.length>1?'flex':'none';
  b.innerHTML=guideSvg(54,'call')+(n?'<span class="gbadge">'+(n>99?'99+':n)+'</span>':'');
}
function openGuide(thanks){
  thanks=typeof thanks==='string'?thanks:'';
  var cs=guideCands();
  if(!cs.length){
    showModal('<div class="gwrap">'+guideSvg(96,thanks?'happy':'sleep')+'<div class="gbub">'+(thanks?esc(thanks)+'<br>':'')+'ぜんぶ教えてもらったよ！ ありがとう！ 図鑑がぴかぴか✨</div></div><div class="row"><button class="btn primary" id="gd_close">とじる</button></div>');
    $('gd_close').onclick=closeModal;return;
  }
  var c=cs[gIdx%cs.length];
  showModal('<div class="gwrap">'+guideSvg(96,thanks?'eat':'ask')+'<div class="gbub">'+(thanks?'<b>'+esc(thanks)+'</b><br>':'')+'<span style="font-size:11px;font-weight:700;color:#8A4B08">ガイドのポム（のこり'+cs.length+'つ）</span><br>'+esc(guideText(c))+'</div></div>'+
    '<input type="text" id="gd_val" placeholder="'+esc(GPH[c.f])+'" style="display:block;width:100%;min-height:48px;margin-top:10px;padding:0 12px;border:1px solid #CFCABD;border-radius:10px;font:inherit;font-size:15px">'+
    '<div class="row"><button class="btn primary" id="gd_ok" style="flex:2 1 150px">教えてあげる（+3pt）</button><button class="btn" id="gd_skip">わからない</button><button class="btn" id="gd_close">とじる</button></div>');
  $('gd_close').onclick=closeModal;
  $('gd_skip').onclick=function(){gIdx++;openGuide();};
  $('gd_ok').onclick=function(){
    var v=$('gd_val').value.trim();if(!v){toast('教えたいことを入力してね');return;}
    c.p[c.f]=v;state.settings.game.bonus=(+state.settings.game.bonus||0)+3;
    commit();openGuide('ありがとう！ '+c.p.name+'の「'+GLABEL[c.f]+'」を図鑑に書いたよ');
  };
  setTimeout(function(){var e=$('gd_val');if(e)e.focus();},60);
}

function excelBlob(){
  var out=XLSX.write(buildWorkbook(),{bookType:'xlsx',type:'array'});
  return new Blob([out],{type:XLSX_MIME});
}
function readWorkbook(file){
  return file.arrayBuffer().then(function(buf){
    if(/\.csv$/i.test(file.name)){
      var text;
      try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){text=new TextDecoder('shift_jis').decode(buf);}
      return XLSX.read(text,{type:'string'});
    }
    return XLSX.read(buf,{type:'array'});
  });
}
function birthdayText(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='number'){var d=XLSX.SSF.parse_date_code(v);if(d)return d.y+'-'+pad(d.m)+'-'+pad(d.d);}
  return String(v).trim();
}
function dirFrom(v){
  var t=txt(v);
  if(/相互|↔|⇔|両/.test(t))return 'both';
  if(/→|一方向/.test(t))return 'one';
  return 'none';
}
function parseWorkbook(wb){
  var warnings=[];
  var sp=wb.Sheets['人物'];
  if(!sp&&wb.SheetNames.length===1)sp=wb.Sheets[wb.SheetNames[0]];
  if(!sp)throw new Error('「人物」シートが見つかりません（Excelの「説明」シートを参考にしてください）');
  var people=[],seen={};
  XLSX.utils.sheet_to_json(sp,{defval:''}).forEach(function(row){
    var name=txt(row['名前']);if(!name)return;
    if(seen[name]){warnings.push('人物「'+name+'」が重複しています（最初の1行だけ使いました）');return;}
    seen[name]=1;
    var label=txt(row['区分']),cat=CAT_BY_LABEL[label];
    if(label&&!cat){warnings.push('区分「'+label+'」は不明なので「その他」にしました：'+name);cat='other';}
    var x=num(row['表示位置X']),y=num(row['表示位置Y']),hasPos=(x!=null&&y!=null);
    people.push({name:name,cat:cat,birthday:birthdayText(row['誕生日']),memo:txt(row['メモ']),likes:txt(row['好き']),dislikes:txt(row['苦手']),next:txt(row['次に話したいこと']),x:hasPos?x:null,y:hasPos?y:null});
  });
  var rels=[];
  if(wb.Sheets['関係']){
    XLSX.utils.sheet_to_json(wb.Sheets['関係'],{defval:''}).forEach(function(row){
      var a=txt(row['人物A']),b=txt(row['人物B']);if(!a&&!b)return;
      rels.push({a:a,b:b,label:txt(row['関係']),dir:dirFrom(row['向き']),color:COLORS[txt(row['色'])]||COLORS['グレー']});
    });
  }
  var contacts=[],gifts=[];
  if(wb.Sheets['交流']){
    XLSX.utils.sheet_to_json(wb.Sheets['交流'],{defval:''}).forEach(function(row){
      var n=txt(row['人物']),note=txt(row['内容']);if(!n&&!note)return;
      contacts.push({name:n,date:dateNorm(row['日付']),kind:txt(row['方法'])||'その他',note:note});
    });
  }
  if(wb.Sheets['贈答']){
    XLSX.utils.sheet_to_json(wb.Sheets['贈答'],{defval:''}).forEach(function(row){
      var n=txt(row['人物']),item=txt(row['品物']);if(!n&&!item)return;
      gifts.push({name:n,date:dateNorm(row['日付']),dir:/もらっ|受|get/.test(txt(row['向き']))?'get':'give',item:item,occasion:txt(row['きっかけ'])});
    });
  }
  var topics=[],missions=[];
  if(wb.Sheets['話題']){
    XLSX.utils.sheet_to_json(wb.Sheets['話題'],{defval:''}).forEach(function(row){
      var n=txt(row['人物']),ti=txt(row['タイトル']),u=txt(row['URL']);if(!ti&&!u)return;
      topics.push({name:n,date:dateNorm(row['日付']),title:ti||u,url:u,note:txt(row['メモ'])});
    });
  }
  if(wb.Sheets['ミッション']){
    XLSX.utils.sheet_to_json(wb.Sheets['ミッション'],{defval:''}).forEach(function(row){
      var ti=txt(row['内容']);if(!ti)return;
      var stt=txt(row['状態']);
      missions.push({name:txt(row['人物']),type:MTYPE_BY_LABEL[txt(row['種類'])]||'custom',title:ti,due:dateNorm(row['期限']),pts:num(row['ポイント']),status:(/完了/.test(stt)&&!/未/.test(stt))?'done':'open',doneAt:dateNorm(row['完了日']),tag:txt(row['タグ']),key:txt(row['キー'])});
    });
  }
  var groups=[];
  if(wb.Sheets['グループ']){
    XLSX.utils.sheet_to_json(wb.Sheets['グループ'],{defval:''}).forEach(function(row){
      var gn=txt(row['グループ名']);if(!gn)return;
      groups.push({name:gn,color:GCOL_BY_NAME[txt(row['色'])]||'#3F7FD8',members:txt(row['メンバー']).split(/[、,，\n]/).map(function(x){return x.trim();}).filter(Boolean)});
    });
  }
  return {people:people,rels:rels,contacts:contacts,gifts:gifts,topics:topics,missions:missions,groups:groups,warnings:warnings};
}
function dateNorm(v){
  var t=birthdayText(v),m=/^(\d{4})[\/.\-年](\d{1,2})[\/.\-月](\d{1,2})/.exec(t);
  return m?m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]):t;
}
function centroid(){
  if(!state.people.length)return {x:0,y:0};
  var sx=0,sy=0;state.people.forEach(function(p){sx+=p.x;sy+=p.y;});
  return {x:sx/state.people.length,y:sy/state.people.length};
}
function applyImport(parsed,mode){
  var stat={added:0,updated:0,relsAdded:0,relsSkipped:0,contactsAdded:0,giftsAdded:0,topicsAdded:0,missionsAdded:0};
  var oldPhotos={};state.people.forEach(function(p){if(photos[p.id])oldPhotos[p.name]=photos[p.id];});
  if(mode==='replace')state=normState({people:[],rels:[],groups:[],settings:state.settings});
  var byName={};state.people.forEach(function(p){byName[p.name]=p;});
  var c=centroid(),n=0;
  parsed.people.forEach(function(row){
    var p=byName[row.name];
    if(p){
      if(row.cat)p.cat=row.cat;
      if(row.birthday!=='')p.birthday=row.birthday;
      if(row.memo!=='')p.memo=row.memo;
      if(row.likes)p.likes=row.likes;if(row.dislikes)p.dislikes=row.dislikes;if(row.next)p.next=row.next;
      if(row.x!=null){p.x=row.x;p.y=row.y;}
      stat.updated++;
    }else{
      p={id:uid(),no:nextNo(),name:row.name,cat:row.cat||'other',birthday:row.birthday,memo:row.memo,likes:row.likes||'',dislikes:row.dislikes||'',next:row.next||'',x:row.x,y:row.y};
      if(p.x==null){var ang=n*2.399963,rad=140+Math.sqrt(n)*70;p.x=c.x+Math.cos(ang)*rad;p.y=c.y+Math.sin(ang)*rad;}
      n++;state.people.push(p);byName[p.name]=p;stat.added++;
      if(oldPhotos[p.name])photos[p.id]=oldPhotos[p.name];
    }
  });
  parsed.rels.forEach(function(r){
    var a=byName[r.a],b=byName[r.b];
    if(!a||!b){stat.relsSkipped++;parsed.warnings.push('線をスキップ：'+r.a+' → '+r.b+'（人物が見つかりません）');return;}
    if(a===b){stat.relsSkipped++;parsed.warnings.push('線をスキップ：同じ人どうし（'+r.a+'）');return;}
    var dup=state.rels.find(function(x){return x.label===r.label&&((x.a===a.id&&x.b===b.id)||(r.dir!=='one'&&x.a===b.id&&x.b===a.id));});
    if(dup){dup.dir=r.dir;dup.color=r.color;return;}
    state.rels.push({id:uid(),a:a.id,b:b.id,label:r.label,dir:r.dir,color:r.color});stat.relsAdded++;
  });
  var seenC={},seenG={};
  state.contacts.forEach(function(c){seenC[[c.pid,c.date,c.kind,c.note].join('|')]=1;});
  state.gifts.forEach(function(g){seenG[[g.pid,g.date,g.dir,g.item,g.occasion].join('|')]=1;});
  (parsed.contacts||[]).forEach(function(r){
    var p=byName[r.name];if(!p){parsed.warnings.push('交流をスキップ：「'+r.name+'」が人物シートにいません');return;}
    var k=[p.id,r.date,r.kind,r.note].join('|');if(seenC[k])return;seenC[k]=1;
    state.contacts.push({id:uid(),pid:p.id,date:r.date,kind:r.kind,note:r.note});stat.contactsAdded++;
  });
  (parsed.gifts||[]).forEach(function(r){
    var p=byName[r.name];if(!p){parsed.warnings.push('贈答をスキップ：「'+r.name+'」が人物シートにいません');return;}
    var k=[p.id,r.date,r.dir,r.item,r.occasion].join('|');if(seenG[k])return;seenG[k]=1;
    state.gifts.push({id:uid(),pid:p.id,date:r.date,dir:r.dir,item:r.item,occasion:r.occasion});stat.giftsAdded++;
  });
  var seenT={},seenM={};
  state.topics.forEach(function(t){seenT[[t.pid,t.date,t.title,t.url].join('|')]=1;});
  state.missions.forEach(function(m){seenM[[m.pid,m.type,m.title,m.due,m.status].join('|')]=1;});
  (parsed.topics||[]).forEach(function(r){
    var p=byName[r.name];if(!p){parsed.warnings.push('話題をスキップ：「'+r.name+'」が人物シートにいません');return;}
    var k=[p.id,r.date,r.title,r.url].join('|');if(seenT[k])return;seenT[k]=1;
    state.topics.push({id:uid(),pid:p.id,date:r.date,title:r.title,url:r.url,note:r.note});stat.topicsAdded++;
  });
  (parsed.missions||[]).forEach(function(r){
    var p=r.name?byName[r.name]:null;if(r.name&&!p){parsed.warnings.push('ミッションをスキップ：「'+r.name+'」が人物シートにいません');return;}
    var pid=p?p.id:'',k=[pid,r.type,r.title,r.due,r.status].join('|');if(seenM[k])return;seenM[k]=1;
    var key='';if(r.key){var ps=r.key.split('|');if(ps.length>=2){ps[1]=pid;key=ps.join('|');}}
    state.missions.push({id:uid(),pid:pid,type:r.type,key:key,tag:r.tag,title:r.title,due:r.due,pts:r.pts!=null?r.pts:(state.settings.pts[r.type]||0),status:r.status,doneAt:r.status==='done'?(r.doneAt||todayStr()):'',createdAt:todayStr()});stat.missionsAdded++;
  });
  (parsed.groups||[]).forEach(function(r){
    var ids=r.members.map(function(n){return byName[n]?byName[n].id:null;}).filter(Boolean);
    if(!ids.length){parsed.warnings.push('グループ「'+r.name+'」はメンバーが見つからないのでスキップ');return;}
    var g=state.groups.find(function(x){return x.name===r.name;});
    if(g){ids.forEach(function(id){if(g.members.indexOf(id)<0)g.members.push(id);});g.color=r.color||g.color;}
    else state.groups.push({id:uid(),name:r.name,color:r.color||'#3F7FD8',members:ids});
  });
  return stat;
}
function showImportResult(stat,warnings){

    (warnings.length?'<p class="note">気になった点（先頭10件）\n'+esc(warnings.slice(0,10).join('\n'))+'</p>':'')+
    '<div class="row"><button class="btn primary" id="r_ok">OK</button></div>');
  $('r_ok').onclick=closeModal;
}
function doImportExcel(file,mode){
  return readWorkbook(file).then(function(wb){
    var parsed=parseWorkbook(wb);
    if(mode==='replace'&&!confirm('今のデータ（'+state.people.length+'人）を置き換えます。\n写真は同じ名前の人だけ引き継ぎます。よろしいですか？')){addLog('置き換えをやめました');return;}
    var stat=applyImport(parsed,mode);
    render();fitView();commit();
    addLog('Excel読み込み：追加'+stat.added+' 更新'+stat.updated+' 線'+stat.relsAdded);
    showImportResult(stat,parsed.warnings);
  });
}

  var R=[['自分','母','母','none'],['自分','はるか','妹','none'],['自分','さくら','友人','none'],['自分','ゆうと','親友','none'],['自分','けんじ','友人','none'],['自分','田中部長','上司','one'],['母','はるか','親子','none'],['さくら','ゆうと','元同級生','both'],['ゆうと','けんじ','ライバル','one'],['田中部長','佐藤さん','部下','one'],['自分','佐藤さん','同僚','none']];
  var rels=R.map(function(a){return {a:a[0],b:a[1],label:a[2],dir:a[3],color:(a[0]==='自分'||a[1]==='自分')?COLORS['グレー']:(a[2]==='ライバル'?COLORS['オレンジ']:COLORS['緑'])};});
  var contacts=[{name:'さくら',date:todayStr(45),kind:'LINE',note:'転職が決まったと報告があった'},{name:'さくら',date:todayStr(100),kind:'対面',note:'新しくできたカフェでランチ'},{name:'母',date:todayStr(5),kind:'電話',note:'実家の庭の話'},{name:'ゆうと',date:todayStr(10),kind:'対面',note:'飲みに行った'},{name:'けんじ',date:todayStr(78),kind:'LINE',note:'スタンプだけ送った'}];
  var gifts=[{name:'さくら',date:todayStr(250),dir:'give',item:'抹茶のお菓子',occasion:'誕生日'},{name:'さくら',date:todayStr(330),dir:'get',item:'ハンドクリーム',occasion:'クリスマス'}];
  var groups=[{name:'家族',color:'#E8628A',members:['母','はるか']},{name:'仕事の仲間',color:'#3F7FD8',members:['田中部長','佐藤さん']},{name:'友だち',color:'#3BAA6B',members:['さくら','ゆうと','けんじ']}];
  return {people:people,rels:rels,contacts:contacts,gifts:gifts,groups:groups,warnings:[]};
}
function dummyData(n){
  var cats=['family','friend','work','other'],people=[],rels=[];
  for(var i=1;i<=n;i++){
    people.push({name:'ダミー'+pad(i),cat:cats[i%4],birthday:'',memo:'',x:null,y:null});
    rels.push({a:'自分',b:'ダミー'+pad(i),label:'テスト',dir:'none',color:COLORS['グレー']});
    if(i%5===0)rels.push({a:'ダミー'+pad(i-1),b:'ダミー'+pad(i),label:'知り合い',dir:'both',color:COLORS['緑']});
  }
  return {people:people,rels:rels,contacts:[],gifts:[],warnings:[]};
}

/* ---------- データ画面 ---------- */

  return ['人物 '+state.people.length+'人 / 線 '+state.rels.length+'本',
    '最終保存：'+(lastSaved?new Date(lastSaved).toLocaleString('ja-JP'):'なし'),
    '保存の永続化：'+(persisted===true?'許可されています':(persisted===false?'未許可（ブラウザの判断で消える可能性あり）':'不明')),
    '版：'+APP_VER,
    '表示：'+(standalone?'ホーム画面のアプリ':'ブラウザ'),

function registerSw(){
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').then(function(){addLog('オフライン対応を登録しました');}).catch(function(e){addLog('SW登録失敗：'+e.message);});
  }
}
function boot(){
  if(typeof cytoscape==='undefined'||typeof XLSX==='undefined'){
    $('stage').style.display='none';$('bar').style.display='none';
    $('fatal').style.display='block';
    $('fatal').textContent='部品（ライブラリ）を読み込めませんでした。通信を確認して、ページを再読み込みしてください。';

}
